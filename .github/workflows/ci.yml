# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: CI

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'main'
      - 'master'
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # black/flake8/isort have all dropped 3.9, and mypy refuses a
        # python_version below 3.10, so 3.10 is the floor we can actually test.
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # tests/ arrives with the test-suite PR; until then lint src only,
      # so this job does not depend on the order those branches land in.
      - name: Resolve lint targets
        id: targets
        run: |
          paths="src"
          if [ -d tests ]; then
            paths="$paths tests"
          fi
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      - name: Check formatting (black)
        run: black --check --diff ${{ steps.targets.outputs.paths }}

      - name: Check import order (isort)
        run: isort --check-only --diff ${{ steps.targets.outputs.paths }}

      - name: Lint (flake8)
        run: flake8 ${{ steps.targets.outputs.paths }}

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            echo "No tests/ directory yet; skipping."
          fi

  build-and-push-image:
    name: Build and publish image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # A single build: pull requests validate the image, pushes publish it.
      # Previously two separate steps each rebuilt the whole image from scratch.
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
